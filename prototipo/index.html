<title>UbicaFrío</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  /* Diseño: consola de cámara frigorífica. Carcasa de acero oscuro (marca, estado de red y pestañas fijas)
     sobre un área de trabajo color escarcha. PC de cortina: mapa | ficha. Terminal de mano: una columna,
     ficha como hoja inferior. Códigos de ubicación y lotes en monoespaciada tabular, como la etiqueta del rack. */
  --ground:#E3E9ED;
  --surface:#F5F8FA;
  --surface-2:#D6DFE5;
  --sunken:#EBF0F3;
  --ink:#0D1A23;
  --ink-2:#4B5F6C;
  --ink-3:#6E828F;
  --line:#B6C4CD;
  --line-2:#D3DCE2;
  --shell:#0E1C26;
  --shell-2:#182C3B;
  --shell-ink:#DDE8EF;
  --shell-ink-2:#93A8B6;
  --shell-accent:#72B2F5;
  --shell-ok:#5FD08F;
  --shell-warn:#F2BC4D;
  --accent:#1A5DA8;
  --accent-ink:#FFFFFF;
  --accent-soft:#D3E2F2;
  --tgt:#D9520C;
  --on-tgt:#FFFFFF;
  --tgt-soft:#F6C7A9;
  --lane:#D9A514;
  --rack:#2C5D93;
  --pallet:#A9875C;
  --floor:#CBD6DD;
  --paper:#FCFDFD;
  --paper-ink:#0D1A23;
  --ok:#17804A;
  --ok-soft:#D6EFDF;
  --warn:#9A6400;
  --warn-soft:#FBEBC6;
  --bad:#B02A22;
  --bad-soft:#F7DBD8;
  --st-free:#F5F8FA;
  --st-occ:#6F9DC4;
  --on-occ:#0D1A23;
  --st-due:#D4930A;
  --on-due:#1A1200;
  --st-blk:#CC3A30;
  --on-blk:#FFFFFF;
  --st-chk:#7C55C7;
  --st-chk-2:#6743B0;
  --on-chk:#FFFFFF;
  --shade:#04101A;
  --glint:#FFFFFF;
  --shadow:0 1px 2px rgba(13,26,35,.08),0 8px 24px rgba(13,26,35,.14);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-stencil:"Big Shoulders Stencil Display","Big Shoulders Display","Arial Narrow",sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:4px;
  --gut:clamp(16px,3vw,28px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1117;--surface:#111C24;--surface-2:#1B2933;--sunken:#0D161D;
    --ink:#E1EAF0;--ink-2:#97AAB7;--ink-3:#71848F;--line:#2B3C48;--line-2:#1F2E38;
    --shell:#050B10;--shell-2:#132433;--shell-ink:#DDE8EF;--shell-ink-2:#8197A6;--shell-accent:#72B2F5;--shell-ok:#5FD08F;--shell-warn:#F2BC4D;
    --accent:#62A0EA;--accent-ink:#04111E;--accent-soft:#16304B;
    --tgt:#FF7A33;--on-tgt:#1A0A00;--tgt-soft:#5A2A10;
    --lane:#B88A12;--rack:#4F86C2;--pallet:#7A6142;--floor:#17242E;
    --paper:#D8DFE3;--paper-ink:#0D1A23;
    --ok:#4CC27E;--ok-soft:#10301F;--warn:#E9B13B;--warn-soft:#382A0B;--bad:#F2766C;--bad-soft:#3B1613;
    --st-free:#111C24;--st-occ:#3A6C93;--on-occ:#EAF2F7;--st-due:#D99A17;--on-due:#1A1200;--st-blk:#E25247;--on-blk:#1A0605;--st-chk:#9A7BE3;--st-chk-2:#8463D3;--on-chk:#120A24;
    --shade:#000000;--glint:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1117;--surface:#111C24;--surface-2:#1B2933;--sunken:#0D161D;
  --ink:#E1EAF0;--ink-2:#97AAB7;--ink-3:#71848F;--line:#2B3C48;--line-2:#1F2E38;
  --shell:#050B10;--shell-2:#132433;--shell-ink:#DDE8EF;--shell-ink-2:#8197A6;--shell-accent:#72B2F5;--shell-ok:#5FD08F;--shell-warn:#F2BC4D;
  --accent:#62A0EA;--accent-ink:#04111E;--accent-soft:#16304B;
  --tgt:#FF7A33;--on-tgt:#1A0A00;--tgt-soft:#5A2A10;
  --lane:#B88A12;--rack:#4F86C2;--pallet:#7A6142;--floor:#17242E;
  --paper:#D8DFE3;--paper-ink:#0D1A23;
  --ok:#4CC27E;--ok-soft:#10301F;--warn:#E9B13B;--warn-soft:#382A0B;--bad:#F2766C;--bad-soft:#3B1613;
  --st-free:#111C24;--st-occ:#3A6C93;--on-occ:#EAF2F7;--st-due:#D99A17;--on-due:#1A1200;--st-blk:#E25247;--on-blk:#1A0605;--st-chk:#9A7BE3;--st-chk-2:#8463D3;--on-chk:#120A24;
  --shade:#000000;--glint:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.45);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
h2{font-size:clamp(1.65rem,1.25rem + 1.3vw,2.15rem)}
h3{font-size:1.3rem}
p{margin:0}
ol,ul{margin:0;padding:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.8125rem}
.b{font-weight:600}
.eyebrow{font:600 .75rem/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Carcasa: marca y controles ---------- */
.shell{background:var(--shell);color:var(--shell-ink)}
.shell :focus-visible{outline-color:var(--shell-accent)}
.shell-in{max-width:1320px;margin-inline:auto;padding-inline:var(--gut)}
.mast .shell-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.brand-mark{width:42px;height:42px;flex:none}
.bm-bg{fill:var(--shell-2)}
.bm-rack{stroke:var(--shell-accent);stroke-width:2;fill:none}
.bm-box{fill:var(--shell-ink-2)}
.bm-tgt{fill:var(--tgt)}
.brand-name{font:800 2.1rem/.9 var(--f-stencil);letter-spacing:.015em}
.brand-sub{font:500 .8125rem/1.3 var(--f-body);color:var(--shell-ink-2);margin-top:3px}
.sim-tag{font:600 .6875rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border:1px dashed var(--shell-ink-2);color:var(--shell-ink-2);border-radius:3px;white-space:nowrap}
.mast-ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl{display:inline-flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--shell-ink-2)}
.ctl select{min-height:44px;background:var(--shell-2);color:var(--shell-ink);border:1px solid var(--shell-ink-2);border-radius:var(--r);padding:0 10px;font-weight:600;font-size:.9375rem}
.sbtn{display:inline-flex;align-items:center;gap:0;min-height:44px;padding:0 12px;background:transparent;color:var(--shell-ink);border:1px solid var(--shell-ink-2);border-radius:var(--r);font-weight:600;font-size:.875rem}
.sbtn:hover{background:var(--shell-2)}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 10px;border:1px solid var(--shell-ink-2);border-radius:var(--r);cursor:pointer;font-size:.875rem;font-weight:600;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.sw-track{width:40px;height:22px;border-radius:11px;background:var(--shell-2);border:1px solid var(--shell-ink-2);position:relative;flex:none;transition:background .2s}
.sw-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--shell-ink);transition:transform .2s}
.switch input:checked + .sw-track{background:var(--shell-warn);border-color:var(--shell-warn)}
.switch input:checked + .sw-track .sw-knob{transform:translateX(18px);background:var(--shell)}
.switch:has(input:focus-visible){outline:3px solid var(--shell-accent);outline-offset:2px}

/* ---------- Barra fija: red + pestañas ---------- */
.ops{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-top:1px solid var(--shell-2);box-shadow:var(--shadow)}
.net{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding-block:7px;font:500 .8125rem/1.25 var(--f-mono);color:var(--shell-ink-2);border-bottom:1px solid var(--shell-2);min-height:34px}
.net svg.ic{width:15px;height:15px;margin-right:5px;vertical-align:-3px}
.n-ok{color:var(--shell-ok);font-weight:600}
.n-warn{color:var(--shell-warn);font-weight:600}
.n-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.n-q{padding:1px 7px;border:1px solid var(--shell-warn);color:var(--shell-warn);border-radius:10px}
.n-prog{display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--shell-2);overflow:hidden;vertical-align:middle}
.n-prog i{display:block;height:100%;background:var(--shell-ok);transition:width .15s}
.n-user{margin-left:auto}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--shell-ink-2);font:600 .9375rem/1 var(--f-body);white-space:nowrap}
.tab-btn:hover{color:var(--shell-ink)}
.tab-btn kbd{font:500 .6875rem/1 var(--f-mono);border:1px solid currentColor;border-radius:3px;padding:2px 4px;opacity:.7}
.tab-btn[aria-selected="true"]{color:var(--shell-ink);border-bottom-color:var(--shell-accent);background:var(--shell-2)}
.tab-badge{font:600 .6875rem/1 var(--f-mono);min-width:20px;padding:3px 5px;border-radius:9px;background:var(--shell-ink);color:var(--shell);text-align:center}
.tab-badge.warn{background:var(--shell-warn)}

/* ---------- Área de trabajo ---------- */
.wrap{max-width:1320px;margin-inline:auto;padding-inline:var(--gut)}
main.wrap{padding-block:20px 36px;display:grid;gap:16px;min-width:0}
.tab{display:grid;gap:16px;min-width:0}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.sec-h > div{display:grid;gap:4px}
.sec-sub{max-width:62ch;font-size:.9375rem}
.h-temp{font:500 .55em/1 var(--f-mono);color:var(--ink-2);vertical-align:.25em;margin-left:6px}
.h-id{font-family:var(--f-mono);font-weight:600;font-size:.86em;letter-spacing:-.03em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px;min-width:0;align-content:start}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.cols{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}}
main.wrap,.tab,.panel,.ficha,.step-b,.kpi,.task,.task-res,.chart,.guide,.target,.mini,.msg-x,.sec-h > div,.pend-main,.res-main,.ficha-sum,.fld,.map-main,.hb,.pk-main{grid-template-columns:minmax(0,1fr)}
.note{display:flex;align-items:flex-start;gap:8px;font-size:.8125rem;color:var(--ink-2)}
.note svg.ic{width:16px;height:16px;margin-top:2px}
.offline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r)}
.offline > svg.ic{width:24px;height:24px;color:var(--warn)}
.offline p{flex:1 1 280px;min-width:0}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-weight:600;font-size:.9375rem;line-height:1.1;text-align:center}
.btn:hover{background:var(--sunken)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-pri:hover{background:var(--accent);filter:brightness(1.1)}
.btn-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.btn-bad:hover{background:var(--bad-soft);filter:brightness(1.05)}
.btn-sim{border-style:dashed;border-color:var(--ink-3);color:var(--ink-2);background:transparent}
.btn-sim:hover{color:var(--ink)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;min-height:44px;padding:0 6px;margin-inline:-6px;border:0;background:transparent;color:var(--accent);font:inherit;text-decoration:underline;text-underline-offset:3px}

/* Segmentado y campos */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg-b{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;background:transparent;font-weight:600;font-size:.9375rem}
.seg-b + .seg-b{border-left:1px solid var(--line)}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.fld{display:grid;gap:6px;min-width:0}
.fld-lab{font-weight:600;font-size:.875rem}
.fld-inline{display:inline-flex;align-items:center;gap:8px;font-size:.875rem;font-weight:600;min-width:0}
.inp{min-height:48px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 12px;font-size:1rem;min-width:0;max-width:100%}
.inp:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.scan{position:relative;display:flex;align-items:center;border:2px solid var(--ink-3);border-radius:var(--r);background:var(--sunken);overflow:hidden;min-width:0}
.scan:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.scan > svg.ic{margin-left:12px;width:22px;height:22px;color:var(--ink-2)}
.scan-in{flex:1;min-width:0;min-height:54px;border:0;background:transparent;padding:0 12px;font:500 1.125rem/1 var(--f-mono);letter-spacing:.02em;text-transform:uppercase;outline:none}
.scan-in::placeholder{color:var(--ink-3);text-transform:none;letter-spacing:0}
.scan-in:disabled{cursor:not-allowed}
.scan .btn{border-radius:0;align-self:stretch;min-height:54px;border-width:0 0 0 1px}
.scan.sm .scan-in{min-height:46px;font-size:1rem}
.scan.sm .btn{min-height:46px}
.scan.is-scan::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--tgt);box-shadow:0 0 8px var(--tgt);animation:laser .45s ease-in-out 2;pointer-events:none}
@keyframes laser{0%{transform:translateY(-16px);opacity:.25}50%{transform:translateY(16px);opacity:1}100%{transform:translateY(-16px);opacity:.25}}

/* Estados: muestras y chips */
.sw{display:inline-block;position:relative;width:14px;height:14px;border-radius:2px;flex:none}
.sw.s-free{background:var(--st-free);border:1px dashed var(--ink-3)}
.sw.s-occ{background:var(--st-occ)}
.sw.s-due{background:var(--st-due)}
.sw.s-due::after{content:"";position:absolute;top:0;right:0;border-left:6px solid transparent;border-top:6px solid var(--on-due)}
.sw.s-blk{background:var(--st-blk)}
.sw.s-blk::after{content:"";position:absolute;inset:2px;background:linear-gradient(45deg,transparent 43%,var(--on-blk) 43% 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,var(--on-blk) 43% 57%,transparent 57%)}
.sw.s-chk{background:repeating-linear-gradient(135deg,var(--st-chk) 0 3px,var(--st-chk-2) 3px 6px)}
.sw.s-tgt{background:transparent;box-shadow:inset 0 0 0 3px var(--tgt)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 8px;border-radius:3px;font:600 .75rem/1.1 var(--f-body);letter-spacing:.02em;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip-fefo{border-color:var(--accent);color:var(--accent)}
.ttag{display:inline-block;font:600 .6875rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:2px;border:1px solid var(--ink-3);color:var(--ink-2);vertical-align:2px}
.ttag.t-C{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8125rem;color:var(--ink-2)}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg b{color:var(--ink);font-variant-numeric:tabular-nums}
.placard{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;background:var(--ink);color:var(--surface);border-radius:3px;font:600 1.5rem/1 var(--f-mono);letter-spacing:.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.placard.sm{font-size:1rem;padding:5px 8px}
.placard.xl{font-size:clamp(1.6rem,1.25rem + 1.8vw,2.4rem);padding:10px 14px}
.placard.tgt{background:var(--tgt);color:var(--on-tgt)}

/* Mensajes */
.msg,.target,.step,.flow,.panel{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 100px);scroll-margin-bottom:16px}
.msg{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 10px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunken)}
.msg > svg.ic{width:22px;height:22px;margin-top:1px}
.msg-x{display:grid;gap:8px;min-width:0}
.msg-t{font-weight:700}
.msg-ok{background:var(--ok-soft);border-color:var(--ok)}
.msg-ok > svg.ic{color:var(--ok)}
.msg-warn{background:var(--warn-soft);border-color:var(--warn)}
.msg-warn > svg.ic{color:var(--warn)}
.msg-bad{background:var(--bad-soft);border-color:var(--bad)}
.msg-bad > svg.ic{color:var(--bad)}
.msg-info{background:var(--accent-soft);border-color:var(--accent)}
.msg-info > svg.ic{color:var(--accent)}

/* ---------- Mapa ---------- */
.cam-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:760px){.cam-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cam{display:grid;gap:5px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:44px;min-width:0}
.cam:hover{border-color:var(--ink-3)}
.cam[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.cam-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
.cam-id{font:600 1.2rem/1 var(--f-mono);letter-spacing:-.02em}
.cam-temp{font:500 .75rem/1 var(--f-mono);color:var(--ink-2)}
.cam-type{font-size:.75rem;color:var(--ink-2);line-height:1.2}
.cam-bar{display:block;height:5px;background:var(--line-2);border-radius:3px;overflow:hidden}
.cam-bar i{display:block;height:100%;background:var(--accent)}
.cam-occ{font:500 .75rem/1.2 var(--f-mono);font-variant-numeric:tabular-nums}
.cam-due{display:inline-flex;align-items:center;gap:5px;font-size:.6875rem;color:var(--ink-2)}
.cam-due .sw{width:10px;height:10px}
.map-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.map-layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1000px){.map-layout{grid-template-columns:minmax(0,1fr) 340px}}
.map-main{min-width:0;display:grid;gap:8px}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
const dayOfYear = d => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / DAY);

function seed() {
  const rnd = mulberry32(2610072);
  const pick = a => a[Math.floor(rnd() * a.length)];
  const now = Date.now(), today = sod(now);
  const st = {
    v: VER, user: USERS[0], online: true, lastSync: now - 3 * MIN,
    pallets: {}, pos: {}, pending: [], moves: [], tasks: [], searches: [],
    counts: {ver: 48, ok: 46}, reserved: [], seq: {move: 0, task: 0, order: 0}, demo: {},

  CHAMBERS.forEach(c => CAMKEYS[c.id].forEach(k => { st.pos[k] = {m: null, chk: null}; }));

  // 1. Borradores de tarimas almacenadas por cámara
  const drafts = [];
  CHAMBERS.forEach(c => {
    const keys = shuffle(CAMKEYS[c.id].slice(), rnd);
    const count = Math.round(keys.length * c.occ);
    const prods = CATALOG.filter(p => p.t === c.type);
    const dom = Array.from({length: c.racks / 2}, () => pick(prods));
    if (c.id === 'C4') { dom[0] = dom[1] = dom[2] = PROD['RES-1101']; dom[9] = dom[10] = PROD['RES-1101']; }
    if (c.id === 'C1') { dom[2] = dom[3] = PROD['RES-1102']; }
    keys.slice(0, count).forEach(k => {
      const prod = rnd() < 0.74 ? dom[pairOf(k) - 1] : pick(prods);
      const age = prod.t === 'C'
        ? Math.min(330, 6 + Math.floor(rnd() * 80) * 4 + (SKU_IDX[prod.sku] % 4))
        : Math.floor(rnd() * (prod.shelf - 8));
      drafts.push({k, sku: prod.sku, age, kind: 'stored'});

  const dl = d => PROD[d.sku].shelf - d.age;

  const c4arr = drafts.filter(d => d.k.startsWith('C4-') && d.sku === 'RES-1101')
    .sort((a, b) => (pairOf(a.k) * 10 + lvOf(a.k)) - (pairOf(b.k) * 10 + lvOf(b.k)));
  const g1 = c4arr[0];
  g1.age = 356; g1.ghost = true; g1.real = null;            // sacada sin registrar
  if (c4arr[1]) c4arr[1].age = 347;
  const g2 = drafts.filter(d => d.k.startsWith('C1-') && d.sku === 'RES-1102')
    .sort((a, b) => pairOf(a.k) - pairOf(b.k))[0] || drafts.find(d => d.k.startsWith('C1-'));
  g2.age = 344; g2.ghost = true; g2.real = '?';             // movida sin registrar
  const v1 = drafts.find(d => d.k.startsWith('C3A-') && !d.ghost && dl(d) > 40);
  if (v1) v1.verif = true;
  const demo = drafts.find(d => d.k.startsWith('C4-') && !d.ghost && d.sku !== 'RES-1101' && d.age >= 40 && d.age <= 200);
  demo.reub = true;
  drafts.forEach(d => { if (!d.ghost && rnd() < 0.06) d.reub = true; });

  const disp = [];

  disp.slice(0, 5).forEach(d => { d.today = true; });
  const pend = [
    {sku: 'RES-1101', age: 0, kind: 'pend', origin: 'Embalaje · Línea 1', mins: 48},
    {sku: 'RES-1103', age: 0, kind: 'pend', origin: 'Embalaje · Línea 1', mins: 36},
    {sku: 'RES-2101', age: 0, kind: 'pend', origin: 'Embalaje · Línea 2', mins: 27},

    {sku: 'RES-1106', age: 0, kind: 'pend', origin: 'Embalaje · Línea 1', mins: 9},

      loc: d.kind === 'stored' ? d.k : null,
      st: d.kind === 'stored' ? 'almacenada' : d.kind === 'disp' ? 'despachada' : 'por_acomodar',
      origin: d.origin || ('Embalaje · Línea ' + (rnd() < 0.5 ? 1 : 2)), ghost: null
    };
    if (d.kind === 'pend') p.qts = d.recv ? now - d.mins * MIN : (d.age === 0 ? Math.max(prodTs + MIN, now - d.mins * MIN) : prodTs + 25 * MIN);
    st.pallets[p.m] = p; d.p = p;
    if (d.kind === 'stored') st.pos[d.k].m = p.m;
    if (d.kind === 'pend') st.pending.push(p.m);
  });
  const c1free = CAMKEYS.C1.filter(k => !st.pos[k].m && pairOf(k) >= 12);
  const real = c1free.length ? c1free[Math.floor(rnd() * c1free.length)] : CAMKEYS.C1.find(k => !st.pos[k].m);
  g2.p.ghost = {real}; st.reserved.push(real);
  g1.p.ghost = {real: null};

  // 7. Bitácora histórica
  const mv = [];
  const push = (ts, user, type, p, from, to, note) => mv.push({ts: Math.min(ts, now - MIN), user, type, m: p.m, lot: p.lot, sku: p.sku, from, to, note: note || '', sync: true});
  const ops = ['Montacarguista 1', 'Montacarguista 1', 'Almacenista'];
  all.forEach(d => {
    const p = d.p;
    if (d.kind === 'pend') {
      if (d.recv) push(p.qts, 'Odoo · Recepción', 'RECEPCION', p, 'Planta Nogales', 'Por acomodar', 'Traspaso entre plantas');
      else push(p.qts, 'Odoo · Embalaje', 'PRODUCCION', p, p.origin, 'Por acomodar');
      return;
    }
    const tProd = p.prod + 15 * MIN;
    push(tProd, 'Odoo · Embalaje', 'PRODUCCION', p, p.origin, 'Por acomodar');
    const tAc = Math.max(tProd + MIN, Math.min(p.prod + (30 + rnd() * 90) * MIN, now - 2 * MIN));
    const cam = d.kind === 'stored' ? camOf(d.k) : pick(CHAMBERS.filter(c => c.type === PROD[p.sku].t)).id;
    if (d.kind === 'stored') {
      if (d.reub) {
        const other = pick(CAMKEYS[cam].filter(k => k !== d.k));
        push(tAc, pick(ops), 'ACOMODO', p, 'Por acomodar', other);
        push(tAc + rnd() * (now - tAc) * 0.8 + MIN, pick(ops), 'REUBICACION', p, other, d.k, 'Reacomodo por FEFO');
      } else push(tAc, pick(ops), 'ACOMODO', p, 'Por acomodar', d.k);
    } else {
      const from = pick(CAMKEYS[cam]);
      push(tAc, pick(ops), 'ACOMODO', p, 'Por acomodar', from);
      const tS = d.today ? Math.max(tAc + 5 * MIN, now - (15 + rnd() * 220) * MIN) : tAc + rnd() * Math.max(MIN, Math.min(now - DAY, tAc + d.age * DAY * 0.9) - tAc);
      push(tS, pick(['Almacenista', 'Montacarguista 1']), 'SALIDA', p, from, pick(DOCKS), 'Surtido de pedido');
    }
  });
  if (v1) {
    st.pos[v1.k].chk = 'T-0001';
    st.tasks.push({id: 'T-0001', key: v1.k, m: v1.p.m, by: 'Montacarguista 1', ts: now - 95 * MIN, src: 'búsqueda', st: 'open'});
    push(now - 95 * MIN, 'Montacarguista 1', 'NO_ENCONTRADO', v1.p, v1.k, 'En verificación', 'Reportado desde búsqueda');
    st.seq.task = 1;
  }
  mv.sort((a, b) => a.ts - b.ts);
  mv.forEach((m, i) => { m.id = 'MOV-' + pad(i + 1, 6); });
  st.moves = mv; st.seq.move = mv.length;

  // 8. Historial de búsquedas de ejemplo y datos para el guion
  for (let i = 0; i < 17; i++) st.searches.push({ts: now - (18 - i) * 37 * MIN, secs: Math.round((6 + rnd() * 14) * 10) / 10, ok: true, q: 'ejemplo'});
  st.searches.splice(9, 0, {ts: now - 9 * 37 * MIN, secs: null, ok: false, q: 'ejemplo'});
  st.demo = {lot: demo.p.lot, g1: g1.k, g2: g2.k};
  return st;
}

function posState(k) {

}

function camStats(id) {
  const keys = CAMKEYS[id];
  const r = {cap: keys.length, used: 0, free: 0, occ: 0, due: 0, blk: 0, chk: 0};
  keys.forEach(k => { const s = posState(k); r[s]++; if (S.pos[k].m) r.used++; });

}

/* ---------- Motor de asignación ---------- */
function nearSame(sku, pk) {
  const c = CH[pk.cam]; let n = 0;
  for (let p = pk.pair - 1; p <= pk.pair + 1; p++) {
    if (p < 1 || p > c.racks / 2) continue;
    [2 * p - 1, 2 * p].forEach(r => {
      for (let l = 1; l <= LV; l++) {
        const k = keyOf(pk.cam, r, l);
        if (k === pk.key) continue;
        const m = S.pos[k].m;
        if (m && S.pallets[m].sku === sku) n++;
      }
    });
  }
  return n;
}
function fefoContext(p) {
  const t = ptype(p.sku);
  const stock = storedPallets().filter(q => ptype(q.sku) === t && q.m !== p.m);
  const r = stock.length ? stock.filter(q => q.exp < p.exp).length / stock.length : 0.5;
  return {r, target: 1 - r};
}
function evalPos(p, pk, ctx, st, hasSku) {
  const NP = CH[pk.cam].racks / 2;
  const acc = 1 - (0.55 * (pk.n - 1) / (LV - 1) + 0.45 * (pk.pair - 1) / Math.max(1, NP - 1));
  const fefo = 1 - Math.abs(ctx.target - acc);
  const nb = nearSame(p.sku, pk);
  const score = Math.round(45 * fefo + 25 * Math.min(1, nb / 4) + 10 * (hasSku ? 1 : 0) + 20 * (1 - st.used / st.cap));
  return {key: pk.key, pk, acc, fefo, nb, hasSku, st, score};
}
function camHasSku(cam, sku) { return CAMKEYS[cam].some(k => S.pos[k].m && S.pallets[S.pos[k].m].sku === sku); }
function suggest(p, exclude) {
  exclude = exclude || [];
  const t = ptype(p.sku), ctx = fefoContext(p), list = [];
  CHAMBERS.forEach(c => {
    if (c.type !== t) return;
    const st = camStats(c.id);
    if ((st.used + 1) / st.cap > MAXOCC) return;
    const has = camHasSku(c.id, p.sku);
    CAMKEYS[c.id].forEach(k => {
      const pos = S.pos[k];
      if (pos.m || pos.chk || S.reserved.includes(k) || exclude.includes(k)) return;
      list.push(evalPos(p, parseKey(k), ctx, st, has));
    });
  });
  list.sort((a, b) => b.score - a.score || a.key.localeCompare(b.key));
  return {ctx, list};
}
function evalKey(p, key) {
  const pk = parseKey(key);
  if (!pk || pk.invalid) return null;
  return evalPos(p, pk, fefoContext(p), camStats(pk.cam), camHasSku(pk.cam, p.sku));
}
function whereText(pk) {
  const NP = CH[pk.cam].racks / 2;
  return 'Cámara ' + pk.cam + ' · lado ' + pk.side + ' (racks ' + (pk.side === 'A' ? 'impares' : 'pares') + ') · ' + pk.pair + '.º par de racks desde la puerta, de ' + NP + ' · nivel ' + pk.n + ' de ' + LV;
}
function reasons(p, ev, ctx) {
  const c = CH[ev.pk.cam], t = TYPE[c.type], pr = PROD[p.sku];
  const zone = ev.acc >= 0.62 ? 'cerca de la puerta y en nivel bajo' : ev.acc >= 0.38 ? 'en zona intermedia del pasillo' : 'al fondo y en nivel alto';
  const later = Math.round(ctx.r * 100);
  const fefoTxt = ctx.r >= 0.5
    ? 'Vence el ' + fmtD(p.exp) + ', después que el ' + later + ' % del inventario ' + t.one + '. Por eso va ' + zone + ' (R' + pad(ev.pk.r) + ' · N' + ev.pk.n + ') y deja las posiciones de acceso rápido para lo que vence antes.'
    : 'Vence el ' + fmtD(p.exp) + ', antes que el ' + (100 - later) + ' % del inventario ' + t.one + '. Por eso va ' + zone + ' (R' + pad(ev.pk.r) + ' · N' + ev.pk.n + ') para salir primero.';
  return [
    {ok: true, h: 'Cámara compatible', t: c.id + ' es de ' + t.name.toLowerCase() + ' (' + t.range + ') y la tarima es de producto ' + t.one + '.'},
    {ok: true, h: 'Posición libre', t: 'Sin tarima registrada, sin bloqueo y sin conteo pendiente.'},
    {ok: true, h: 'FEFO', t: fefoTxt},
    {ok: ev.nb > 0, h: 'Agrupa el mismo producto', t: ev.nb > 0 ? 'Queda junto a ' + ev.nb + ' tarima' + (ev.nb > 1 ? 's' : '') + ' de ' + pr.name.toLowerCase() + ' en los racks vecinos.' : ev.hasSku ? 'Hay ' + pr.name.toLowerCase() + ' en ' + c.id + ', pero no en racks vecinos libres.' : 'Será la primera tarima de ' + pr.name.toLowerCase() + ' en ' + c.id + '.'},
    {ok: true, h: 'Capacidad', t: fmtKg(p.kg) + ' de ' + fmtInt(MAXKG) + ' kg por nivel. ' + c.id + ' quedará al ' + pct((ev.st.used + 1) / ev.st.cap) + ' (límite ' + pct(MAXOCC) + ').'}
  ];
}

/* ---------- FEFO para surtido ---------- */
function fefoCandidates(sku) {
  const ok = [], excl = [];
  storedPallets().filter(p => p.sku === sku).forEach(p => {
    const pos = S.pos[p.loc], d = daysLeft(p);
    if (pos.chk) excl.push({m: p.m, key: p.loc, why: 'en verificación (conteo pendiente)'});
    else if (d < 0 || p.blocked) excl.push({m: p.m, key: p.loc, why: 'vencida: bloqueada por calidad'});
    else ok.push(p);
  });
  ok.sort((a, b) => a.exp - b.exp || lvOf(a.loc) - lvOf(b.loc) || a.loc.localeCompare(b.loc));
  return {ok, excl};
}

/* =========================================================
   Sincronización con Odoo (simulada) y modo sin internet
   ========================================================= */
let syncTimer = 0, syncing = false, netProg = null;
function scheduleSync() {
  if (!S.online || syncing) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    if (!S.online || syncing) return;
    let n = 0;
    S.moves.forEach(m => { if (!m.sync) { m.sync = true; n++; } });
    if (n) { S.lastSync = Date.now(); save(); renderShell(); refreshLive(); }
  }, 1100);
}
function setOnline(on) {
  if (on === S.online) { renderShell(); return; }
  S.online = on;
  if (!on) {
    clearTimeout(syncTimer);
    toast('Sin internet. UbicaFrío sigue operando en la red local; los movimientos quedan en cola para Odoo.', 'warn');
    render();
    return;
  }
  const queue = S.moves.filter(m => !m.sync);
  render();
  if (!queue.length) { S.lastSync = Date.now(); renderShell(); toast('Internet restaurado. No había movimientos pendientes.', 'ok'); return; }
  syncing = true;
  let i = 0;
  const total = queue.length;
  netProg = {done: 0, total};
  renderShell();
  const step = () => {
    if (!S.online) { syncing = false; netProg = null; renderShell(); return; }
    queue[i].sync = true; i++;
    netProg = {done: i, total};
    renderShell(); refreshLive();
    if (i < total) setTimeout(step, RM.matches ? 20 : Math.max(70, Math.min(260, 1800 / total)));
    else {
      syncing = false; netProg = null; S.lastSync = Date.now(); save();
      renderShell(); refreshLive();
      toast(total + ' movimiento' + (total > 1 ? 's' : '') + ' sincronizado' + (total > 1 ? 's' : '') + ' con Odoo. Cola en cero.', 'ok');
    }
  };
  setTimeout(step, RM.matches ? 0 : 400);
}
function refreshLive() {
  const k = $('#kpi-queue');
  if (k) k.textContent = queueLen();
  if (S.ui.tab === 'log') updateLogTable();
  if (S.ui.tab === 'put' || S.ui.tab === 'out' || S.ui.tab === 'move') { $$('[data-sync-of]').forEach(el => { const mv = S.moves.find(m => m.id === el.dataset.syncOf); if (mv) el.innerHTML = syncHTML(mv); }); }

  if (opts.actions) {

function drawSearchChart() {
  const box = $('#chart-search'); if (!box) return;
  const data = S.searches.filter(s => s.ok && s.secs != null).slice(-20);
  if (data.length < 2) { box.innerHTML = '<p class="muted">Aún no hay suficientes búsquedas.</p>'; return; }
  const W = Math.max(260, box.clientWidth), H = 190, m = {l: 34, r: 52, t: 12, b: 26};
  const maxV = Math.max(10, Math.ceil(Math.max(...data.map(d => d.secs)) / 5) * 5);
  const x = i => m.l + i * (W - m.l - m.r) / (data.length - 1);
  const y = v => m.t + (1 - v / maxV) * (H - m.t - m.b);
  const step = maxV > 20 ? 10 : 5;
  let g = '';
  for (let v = 0; v <= maxV; v += step) g += '<line class="ch-grid" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"></line><text class="ch-txt" x="' + (m.l - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
  const avg = data.reduce((a, d) => a + d.secs, 0) / data.length;
  const pts = data.map((d, i) => x(i).toFixed(1) + ',' + y(d.secs).toFixed(1));
  const last = data[data.length - 1];
  box.innerHTML = '<svg class="ch-svg" id="srch-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Segundos hasta ubicar en las últimas ' + data.length + ' búsquedas; promedio ' + avg.toFixed(1) + ' segundos">' + g +
    '<line class="ch-axis" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(0) + '" y2="' + y(0) + '"></line>' +
    '<line class="ch-ref" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(avg) + '" y2="' + y(avg) + '"></line><text class="ch-txt" x="' + (W - m.r + 6) + '" y="' + (y(avg) + 4) + '">prom.</text>' +
    '<path class="ch-area" d="M' + x(0) + ',' + y(0) + ' L' + pts.join(' L') + ' L' + x(data.length - 1) + ',' + y(0) + ' Z"></path>' +
    '<polyline class="ch-line" points="' + pts.join(' ') + '"></polyline>' +
    '<line class="ch-cross" id="srch-cross" x1="0" x2="0" y1="' + m.t + '" y2="' + y(0) + '" visibility="hidden"></line>' +
    '<circle class="ch-dot" cx="' + x(data.length - 1) + '" cy="' + y(last.secs) + '" r="4.5"></circle>' +
    '<text class="ch-lab" x="' + (x(data.length - 1) + 8) + '" y="' + (y(last.secs) - 8) + '">' + last.secs.toFixed(1) + ' s</text>' +
    '<text class="ch-txt" x="' + m.l + '" y="' + (H - 6) + '">1</text><text class="ch-txt" x="' + (W - m.r) + '" y="' + (H - 6) + '" text-anchor="end">' + data.length + ' (más reciente)</text>' +
    '<rect class="ch-hit" id="srch-hit" x="' + m.l + '" y="' + m.t + '" width="' + (W - m.l - m.r) + '" height="' + (H - m.t - m.b) + '"></rect></svg>';
  const hit = $('#srch-hit'), cross = $('#srch-cross');
  const move = ev => {
    const r = hit.getBoundingClientRect();
    const i = Math.max(0, Math.min(data.length - 1, Math.round((ev.clientX - r.left) / r.width * (data.length - 1))));
    cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
    showTip('<b>' + data[i].secs.toFixed(1) + ' s</b> · búsqueda ' + (i + 1) + ' de ' + data.length + '<br>' + fmtT(data[i].ts), ev.clientX, ev.clientY);
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(); });

    case 'mv-master': mvMaster(v); break;
    case 'mv-to': mvTo(v); break;
    case 'task-moved': taskMoved(f.dataset.id, v); break;
  }
  if (next) { const n = document.getElementById(next); if (n && !n.disabled) n.focus(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'net-toggle') setOnline(!t.checked);
  else if (t.id === 'user-sel') { S.user = t.value; renderShell(); if (S.ui.tab === 'count') renderCount(); save(); toast('Usuario activo: ' + t.value + '. Sus movimientos quedan con su nombre.', 'info'); }
  else if (t.id === 'map-filter') { S.ui.mapFilter = t.value; renderMap(); save(); }
  else if (t.id === 'log-type') { S.ui.logType = t.value; S.ui.logLimit = 100; updateLog(); save(); }
  else if (t.id === 'out-sku' || t.id === 'out-dock' || t.id === 'out-qty') { S.ui.outForm = {sku: $('#out-sku').value, qty: parseInt($('#out-qty').value, 10) || 1, dock: $('#out-dock').value}; save(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    S.ui.q = t.value;
    if (t.value.trim() && !findStart) findStart = performance.now();
    if (!t.value.trim()) findStart = 0;
    updateFind(); save();
  } else if (t.id === 'log-lot') { S.ui.logLot = t.value; S.ui.logLimit = 100; updateLog(); save(); }
  else if (t.id === 'log-q') { S.ui.logQ = t.value; S.ui.logLimit = 100; updateLogTable(); save(); }
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.tv) { if (d.open) TV_OPEN.add(d.dataset.tv); else TV_OPEN.delete(d.dataset.tv); }
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#guide').hidden) { toggleGuide(false); return; }
    if (S.ui.sel && S.ui.tab === 'map') { S.ui.sel = null; render(); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input:not([type="checkbox"]), select, textarea, [contenteditable="true"]')) return;
  const k = e.key.toLowerCase();
  if (/^[1-8]$/.test(k)) { e.preventDefault(); setTab(TABS[+k - 1][0]); }
  else if (k === '/') { e.preventDefault(); setTab('find'); const q = $('#q'); if (q) q.focus(); }
  else if (k === 'i') setOnline(!S.online);
  else if (k === 'g') toggleGuide();
  else if (k === 'v' && S.ui.tab === 'map') { S.ui.view = S.ui.view === '2d' ? '3d' : '2d'; render(); }
  else if (k === 's') { const b = $('#tab-' + S.ui.tab + ' [data-sim-primary="1"]'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});
// Tooltip para barras de indicadores y para la vista 3D
document.addEventListener('pointerover', e => { const r = e.target.closest && e.target.closest('[data-tip]'); if (r) { const b = r.getBoundingClientRect(); showTip(r.dataset.tip, b.left + b.width / 2, b.top); } });
document.addEventListener('pointerout', e => { const r = e.target.closest && e.target.closest('[data-tip]'); if (r && !r.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const r = e.target.closest && e.target.closest('[data-tip]'); if (r) { const b = r.getBoundingClientRect(); showTip(r.dataset.tip, b.left + b.width / 2, b.top); } });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('pointermove', e => {
  if (!e.target.closest || !e.target.closest('#iso')) return;
  const k = isoHit(e);
  e.target.style.cursor = k ? 'pointer' : 'default';
  if (!k) { hideTip(); return; }
  const pos = S.pos[k], p = pos.m ? S.pallets[pos.m] : null;
  showTip('<b>' + k + '</b> · ' + STATE_L[posState(k)] + (p ? '<br>' + esc(pname(p.sku)) + ' · ' + p.lot + '<br>' + dueText(p) : ''), e.clientX, e.clientY);
});
document.addEventListener('pointerleave', e => { if (e.target && e.target.id === 'iso') hideTip(); }, true);

let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(redrawGraphics, 120); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawGraphics);
new MutationObserver(redrawGraphics).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

// Temperatura simulada de cada cámara y cronómetro de búsqueda
setInterval(() => {
  CHAMBERS.forEach(c => { TEMP[c.id] = Math.round((TEMP[c.id] + (Math.random() - 0.5) * 0.16 + (c.base - TEMP[c.id]) * 0.25) * 100) / 100; });
  $$('[data-temp]').forEach(el => { el.textContent = fmtTemp(el.dataset.temp); });
}, 5000);
setInterval(() => {
  if (!findStart || S.ui.tab !== 'find') return;
  const el = $('#find-clock');
  if (el) el.textContent = ((performance.now() - findStart) / 1000).toFixed(1) + ' s';
}, 100);
setInterval(() => { if (S.ui.tab === 'count') { /* refresca “hace N min” sin perder lo escrito */ $$('#tab-count input').length || renderCount(); } }, 60000);

/* =========================================================
   Arranque
   ========================================================= */
S = load() || seed();
if (!TAB_IDS.includes(S.ui.tab)) S.ui.tab = 'map';
S.ui.hl = S.ui.hl && S.pos[S.ui.hl] ? S.ui.hl : null;
applyTheme();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawGraphics).catch(() => {});
})();
</script>
